<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout — Assaf Perfumes</title>
  <meta name="description" content="Secure checkout for Assaf Perfumes." />
  <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e0b08'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='34' fill='%23e7c987' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>try{var t=localStorage.getItem("assaf_theme");if(t)document.documentElement.setAttribute("data-theme",JSON.parse(t))}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="checkout" data-solid-header>
  <main>
    <section class="page-hero"><span class="eyebrow">Secure checkout</span><h1>Checkout</h1></section>
    <section class="container section" style="padding-top:40px" data-checkout>
      <div class="checkout-layout">
        <form id="checkout-form" novalidate>
          <div class="form-section">
            <h3><i>1</i> Contact</h3>
            <div class="fields">
              <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required /><span class="err">Enter a valid email</span></div>
              <div class="field"><label for="phone">Mobile</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+971 5x xxx xxxx" pattern="[+0-9 ]{9,16}" required /><span class="err">Enter a valid mobile number</span></div>
            </div>
          </div>
          <div class="form-section">
            <h3><i>2</i> Delivery address</h3>
            <div class="fields">
              <div class="field"><label for="firstName">First name</label><input id="firstName" name="firstName" autocomplete="given-name" required /><span class="err">Required</span></div>
              <div class="field"><label for="lastName">Last name</label><input id="lastName" name="lastName" autocomplete="family-name" required /><span class="err">Required</span></div>
              <div class="field full"><label for="address">Street address</label><input id="address" name="address" autocomplete="street-address" required /><span class="err">Required</span></div>
              <div class="field"><label for="city">City</label>
                <select id="city" name="city" required>
                  <option value="">Select city</option>
                  <optgroup label="United Arab Emirates"><option>Dubai</option><option>Abu Dhabi</option><option>Sharjah</option><option>Ajman</option><option>Ras Al Khaimah</option><option>Fujairah</option><option>Umm Al Quwain</option><option>Al Ain</option></optgroup>
                  <optgroup label="Saudi Arabia"><option>Riyadh</option><option>Jeddah</option><option>Dammam</option><option>Khobar</option><option>Mecca</option><option>Medina</option></optgroup>
                  <optgroup label="GCC"><option>Kuwait City</option><option>Doha</option><option>Manama</option><option>Muscat</option></optgroup>
                </select><span class="err">Choose a city</span></div>
              <div class="field"><label for="zip">Postal code</label><input id="zip" name="zip" autocomplete="postal-code" inputmode="numeric" /></div>
            </div>
          </div>
          <div class="form-section">
            <h3><i>3</i> Delivery method</h3>
            <div class="choices">
              <label class="choice"><input type="radio" name="shipping" value="express" checked /><span>Express shipping<small>Free on orders over AED 275</small></span></label>
            </div>
          </div>
          <div class="form-section">
            <h3><i>4</i> Payment</h3>
            <div class="choices">
              <label class="choice"><input type="radio" name="payment" value="card" checked /><span>Credit / debit card<small>Visa, Mastercard</small></span></label>
              <label class="choice"><input type="radio" name="payment" value="tamara" /><span>Tamara<small>Split your payment into instalments</small></span></label>
            </div>
            <div class="fields" data-card-fields style="margin-top:14px">
              <div class="field full"><label for="cardNumber">Card number</label><input id="cardNumber" name="cardNumber" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" pattern="[0-9 ]{19}" required /><span class="err">Enter a 16-digit card number</span></div>
              <div class="field"><label for="cardExp">Expiry</label><input id="cardExp" name="cardExp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" pattern="(0[1-9]|1[0-2])/[0-9]{2}" required /><span class="err">MM/YY</span></div>
              <div class="field"><label for="cardCvc">CVC</label><input id="cardCvc" name="cardCvc" inputmode="numeric" autocomplete="cc-csc" placeholder="123" pattern="[0-9]{3,4}" required /><span class="err">3–4 digits</span></div>
            </div>
          </div>
          <button class="btn btn-gold btn-block" type="submit" style="margin-top:8px">Place order</button>
          <p class="secure">🔒 Payments are encrypted and processed securely</p>
        </form>
        <div class="checkout-side" data-checkout-summary></div>
      </div>
    </section>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/bottle.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/unbox.js"></script>
</body>
</html>
